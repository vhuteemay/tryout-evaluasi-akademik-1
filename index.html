        // Fisher-Yates: setiap sesi mengacak urutan soal dan pilihan jawaban.
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function shuffleQuestionOptions(question) {
            const options = question.o.map((text, index) => ({ text, correct: index === question.c }));
            const shuffled = shuffleArray(options);
            return { ...question, o: shuffled.map(x => x.text), c: shuffled.findIndex(x => x.correct) };
        }

        function buildExamQuestions() {
            return shuffleArray(generateQuestions()).map(shuffleQuestionOptions);
        }

        function showModal(type, title, message, buttons) {
            document.getElementById('modal-title').innerText = title;

            const iconDiv = document.getElementById('modal-icon');
            if (type === 'error') {
                iconDiv.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-rose-100 text-rose-600';
                iconDiv.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`;
            } else if (type === 'warning') {
                iconDiv.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-amber-100 text-amber-600';
                iconDiv.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;

                iconDiv.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
            }

            const actionsDiv = document.getElementById('modal-actions');
            actionsDiv.innerHTML = '';
            
            buttons.forEach(btn => {
                const b = document.createElement('button');
                b.className = `px-5 py-2.5 rounded-lg text-sm font-bold transition flex-1 sm:flex-none text-center ${btn.classNames}`;
                b.innerText = btn.text;
                b.onclick = () => {
                    document.getElementById('custom-modal').classList.remove('modal-active');
                    document.getElementById('custom-modal').classList.add('hidden');
                    if(btn.onClick) btn.onClick();
                };
                actionsDiv.appendChild(b);
            });

            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('modal-active');
        }

                        <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 mb-8">
                            <ul class="space-y-4 text-sm font-medium text-indigo-900 list-disc pl-4 leading-relaxed">
                                <li><strong>40 Soal Analisis Kasus (HOTS):</strong> Ujian mengukur kompetensi C4-C6 Manajerial dan BerAKHLAK.</li>
                                <li><strong>Sistem Acak Otomatis (Shuffle):</strong> Urutan soal di-generate acak pada setiap sesi.</li>
                                <li><strong>Alokasi Waktu:</strong> 90 Menit. Sistem akan otomatis tersubmit (terkunci) saat timer habis.</li>
                                <li class="text-rose-700 bg-rose-100/50 p-2 rounded-lg -ml-4 pl-6 relative">
                                    <div class="absolute left-0 top-0 h-full w-1 bg-rose-500 rounded-l-lg"></div>
                                    <strong>Syarat Remedial:</strong> Kunci jawaban dan pembahasan HANYA dapat diakses apabila nilai akhir mencapai KKM (Lulus).
                                </li>
                            </ul>
                        </div>

                        <div class="flex flex-col-reverse sm:flex-row justify-end gap-3">
                            <button onclick="appState.currentScreen='login'; render();" class="px-6 py-3.5 rounded-xl text-slate-500 font-bold bg-slate-100 hover:bg-slate-200 transition text-sm">Kembali</button>
                            <button onclick="startExam()" class="px-8 py-3.5 rounded-xl text-white font-bold bg-indigo-600 hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 text-sm uppercase tracking-widest">Setuju & Mulai Ujian</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function startExam(isRemedial = false) {
            if (isRemedial) appState.attempt++;
            appState.currentScreen = 'exam';
            appState.currentIndex = 0;
            appState.answers = {};
            appState.flagged = {};
            appState.timeLeft = examData.duration;

            // Setiap sesi baru dan setiap remedial mendapatkan randomisasi baru.
            appState.questions = buildExamQuestions();

            if (appState.timerInterval) clearInterval(appState.timerInterval);
            appState.timerInterval = setInterval(() => {
                if (appState.timeLeft > 0) {
                    appState.timeLeft--;
                    const el = document.getElementById('timer-val');
                    if (el) {
                        const m = Math.floor(appState.timeLeft / 60);
                        const ss = appState.timeLeft % 60;
                        el.innerText = `${m.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;
                        if(appState.timeLeft <= 300) {
                            el.parentElement.classList.add('bg-rose-100','text-rose-800','border-rose-300');
                            el.classList.add('animate-pulse');
                        }
                    }
                } else {
                    clearInterval(appState.timerInterval);
                    processSubmission();
                }
            }, 1000);
            render();
        }

        // --- PAGE 3: EXAM (NAVIGASI DI SEBELAH KIRI) ---
        function renderExam() {
            const q = appState.questions[appState.currentIndex];
            const m = Math.floor(appState.timeLeft / 60), ss = appState.timeLeft % 60;
            const timeStr = `${m.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;

            return `
                <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-3 shadow-sm">
                    <div class="max-w-[1250px] mx-auto flex justify-between items-center gap-4">
                        <div class="hidden sm:flex flex-col">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">TRYOUT EVALUASI AKADEMIK 1</span>
                            <span class="text-sm font-bold text-slate-800">${appState.name}</span>
                        </div>
                        <div class="flex items-center gap-3 sm:gap-5 ml-auto">
                            <span class="hidden md:block text-xs font-bold text-slate-500">Percobaan ${appState.attempt}/${appState.maxAttempts}</span>
                            <div class="flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-xl border border-slate-200">
                                <span>⏱</span><span id="timer-val" class="font-mono font-bold tracking-widest">${timeStr}</span>
                            </div>
                            <button onclick="confirmSubmit()" class="bg-rose-600 hover:bg-rose-700 text-white px-5 py-2 rounded-xl text-sm font-bold">Selesai & Kumpulkan</button>
                        </div>
                    </div>
                </header>

                <main class="flex-1 w-full max-w-[1250px] mx-auto px-3 sm:px-4 py-5 sm:py-7 fade-in">
                    <div class="grid grid-cols-1 lg:grid-cols-[245px_minmax(0,1fr)] gap-5 items-start">
                        <aside class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 lg:sticky lg:top-[80px]">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                                <div><h4 class="font-black text-slate-800 text-sm uppercase tracking-widest">Navigasi Soal</h4><p class="text-[10px] text-slate-400 mt-1">Pilih nomor soal</p></div>
                                <span class="text-xs font-black text-indigo-600">${appState.currentIndex+1}/40</span>
                            </div>
                            <div class="grid grid-cols-5 gap-2">
                                ${appState.questions.map((_,idx)=>{
                                    const ans=appState.answers[idx]!==undefined, flag=appState.flagged[idx], cur=appState.currentIndex===idx;
                                    let cls="bg-white border-2 border-slate-200 text-slate-500 hover:bg-slate-50";
                                    if(ans) cls="bg-indigo-600 text-white border-indigo-700";
                                    if(flag) cls="bg-amber-400 text-amber-900 border-amber-500";
                                    if(cur) cls+=" ring-[3px] ring-slate-900 ring-offset-1 font-black";
                                    return `<button onclick="appState.currentIndex=${idx};render();window.scrollTo({top:0,behavior:'smooth'});" class="h-10 w-full rounded-lg text-xs font-bold flex items-center justify-center ${cls}">${idx+1}</button>`;
                                }).join('')}
                            </div>
                            <div class="border-t border-slate-100 mt-5 pt-4 space-y-2 text-[10px] font-bold text-slate-500">
                                <div><span class="inline-block w-3 h-3 bg-indigo-600 rounded mr-2"></span>Sudah dijawab</div>
                                <div><span class="inline-block w-3 h-3 border-2 border-slate-300 rounded mr-2"></span>Belum dijawab</div>
                                <div><span class="inline-block w-3 h-3 bg-amber-400 rounded mr-2"></span>Ragu-ragu</div>
                            </div>
                        </aside>

                        <section class="bg-white p-5 sm:p-9 rounded-2xl sm:rounded-[2rem] border border-slate-200 shadow-sm">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-5 mb-7">
                                <h3 class="bg-slate-900 text-white px-4 py-1.5 rounded-lg text-sm font-black tracking-widest">SOAL NO. ${appState.currentIndex+1}</h3>
                                <span class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">HOTS • C4–C6</span>
                            </div>
                            <p class="text-base sm:text-lg font-medium text-slate-800 leading-relaxed mb-8 text-justify">${q.q}</p>
                            <div class="space-y-3">
                                ${q.o.map((opt,idx)=>{
                                    const sel=appState.answers[appState.currentIndex]===idx;
                                    return `<label class="relative flex items-start p-4 sm:p-5 rounded-xl border-2 cursor-pointer transition-all ${sel?'border-indigo-600 bg-indigo-50/50':'border-slate-100 hover:bg-slate-50 hover:border-slate-300'}">
                                        <input type="radio" name="option" class="peer sr-only" ${sel?'checked':''} onchange="appState.answers[${appState.currentIndex}]=${idx};render();">
                                        <div class="w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-slate-300 flex items-center justify-center mr-4 mt-0.5 bg-white shrink-0"><div class="radio-dot w-2.5 h-2.5 rounded-full bg-transparent"></div></div>
                                        <div class="text-sm sm:text-base text-slate-700 font-medium leading-relaxed"><span class="font-black text-slate-300 mr-2">${String.fromCharCode(65+idx)}.</span>${opt}</div>
                                    </label>`;
                                }).join('')}
                            </div>
                            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mt-8 pt-6 border-t border-slate-100">
                                <button onclick="if(appState.currentIndex>0){appState.currentIndex--;render();}" ${appState.currentIndex===0?'disabled':''} class="w-full sm:w-auto px-6 py-3 rounded-xl text-sm font-bold border-2 border-slate-200 ${appState.currentIndex===0?'opacity-40 cursor-not-allowed':'hover:bg-slate-50'}">← Soal Sebelumnya</button>
                                <label class="w-full sm:w-auto flex items-center justify-center gap-2 border-2 px-5 py-3 rounded-xl text-sm font-bold cursor-pointer ${appState.flagged[appState.currentIndex]?'border-amber-400 bg-amber-50 text-amber-800':'border-slate-200 text-slate-500'}">
                                    <input type="checkbox" ${appState.flagged[appState.currentIndex]?'checked':''} onchange="appState.flagged[${appState.currentIndex}]=!appState.flagged[${appState.currentIndex]};render();"> Tandai Ragu-Ragu
                                </label>
                                <button onclick="if(appState.currentIndex<39){appState.currentIndex++;render();}else confirmSubmit();" class="w-full sm:w-auto bg-slate-900 text-white px-7 py-3 rounded-xl text-sm font-bold hover:bg-slate-800">${appState.currentIndex===39?'Selesai & Kumpulkan':'Soal Selanjutnya →'}</button>
                            </div>
                        </section>
                    </div>
                </main>
            `;
        }

        function confirmSubmit() {
            const empty = 40 - Object.keys(appState.answers).length;
            let msg = empty > 0 
                ? `Peringatan: Terdapat <strong class="text-rose-600">${empty} soal</strong> yang dibiarkan kosong. Soal kosong bernilai salah (0). Yakin ingin mengakhiri sesi sekarang?`
                : "Anda telah menyelesaikan seluruh butir soal. Apakah Anda yakin ingin mengunci jawaban dan melihat hasil evaluasi?";

            showModal('warning', 'Konfirmasi Akhiri Ujian', msg, [
                { text: 'Periksa Ulang', classNames: 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-50' },
                { text: 'Kunci & Proses Nilai', classNames: 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-md', onClick: processSubmission }
            ]);
        }

        function processSubmission() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);
            let correct = 0;
            appState.questions.forEach((q, i) => {
                if (appState.answers[i] === q.c) correct++;
            });
            // Total score scale 100 (40 * 2.5)
            const score = (correct * 2.5).toFixed(1); 
            // Convert to int if no decimal
            const finalScore = score % 1 === 0 ? parseInt(score) : parseFloat(score);

            appState.scoreData = { score: finalScore, correct, wrong: Object.keys(appState.answers).filter(i => appState.answers[i] !== appState.questions[i].c).length, blank: 40 - Object.keys(appState.answers).length, passed: finalScore >= examData.passingScore };
            appState.currentScreen = 'result';
            render();
            window.scrollTo(0, 0);
        }

        // --- PAGE 4: RESULT SCREEN ---
        function renderResult() {
            const data = appState.scoreData;
            
            let conditionalContent = '';
            if (data.passed) {
                // LOGIKA LULUS: TAMPILKAN FULL PEMBAHASAN
                let list = appState.questions.map((q, idx) => {
                    const ans = appState.answers[idx];
                    const isCorrect = ans === q.c;
                    return `
                        <div class="bg-white rounded-[2rem] p-6 sm:p-10 border border-slate-200 shadow-sm mb-8 break-inside-avoid">
                            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-5">
                                <span class="font-black text-slate-800 text-sm bg-slate-100 px-4 py-2 rounded-lg tracking-widest">KASUS NO. ${idx + 1}</span>
                                <span class="text-[10px] sm:text-xs font-black px-4 py-2 rounded-lg uppercase tracking-widest border ${ans===undefined ? 'bg-slate-50 text-slate-500 border-slate-200' : (isCorrect ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200')}">
                                    ${ans===undefined ? 'KOSONG (0 Poin)' : (isCorrect ? 'BENAR (2.5 Poin)' : 'SALAH (0 Poin)')}
                                </span>
                            </div>
                            <p class="font-medium text-slate-800 mb-8 text-sm sm:text-base leading-relaxed text-justify">${q.q}</p>
                            
                            <div class="space-y-3 mb-8">
                                ${q.o.map((opt, oIdx) => {
                                    let style = "bg-white border-2 border-slate-100 text-slate-500";
                                    let badge = "";
                                    if(oIdx === q.c) { style = "bg-emerald-50/50 border-2 border-emerald-400 text-emerald-900 font-bold shadow-sm"; badge = "KUNCI JAWABAN"; } 
                                    else if(oIdx === ans) { style = "bg-rose-50/50 border-2 border-rose-300 text-rose-900 font-bold"; badge = "PILIHAN ANDA"; }
                                    
                                    return `
                                        <div class="p-4 sm:p-5 rounded-xl text-sm sm:text-base flex justify-between items-center transition ${style}">
                                            <div class="flex-1 leading-relaxed"><span class="mr-3 opacity-40 font-black tracking-wider">${String.fromCharCode(65+oIdx)}.</span> ${opt}</div>
                                            ${badge ? `<span class="text-[9px] font-black px-2.5 py-1.5 rounded shadow-sm text-white ${oIdx===q.c ? 'bg-emerald-500' : 'bg-rose-500'} uppercase tracking-widest shrink-0 ml-3">${badge}</span>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <div class="bg-indigo-50/70 border border-indigo-100 p-6 sm:p-8 rounded-2xl text-sm text-indigo-900 relative overflow-hidden">
                                <div class="absolute left-0 top-0 w-1.5 h-full bg-indigo-500"></div>
                                <span class="flex items-center gap-2 font-black mb-3 uppercase text-xs tracking-widest text-indigo-700">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    Analisis Manajerial & Pembahasan
                                </span> 
                                <p class="leading-loose font-medium opacity-90 text-justify">${q.e}</p>
                            </div>
                        </div>
                    `;
                }).join('');

                conditionalContent = `
                    <div class="mt-16 max-w-5xl mx-auto fade-in">
                        <div class="text-center mb-10">
                            <h3 class="text-2xl font-black text-slate-900 uppercase tracking-tight">Eksplorasi Pembahasan</h3>
                            <p class="text-slate-500 text-sm mt-2 font-medium">Tinjauan analitik atas 40 studi kasus untuk mempertajam intuisi manajerial Anda.</p>
                        </div>
                        ${list}
                    </div>
                `;
            } else {
                // REMEDIAL MAKSIMAL 2 KALI
                const remainingRemedial = appState.maxAttempts - appState.attempt;
                conditionalContent = `
                    <div class="bg-rose-50 border-2 border-rose-200 rounded-[2.5rem] p-8 sm:p-14 text-center mt-12 shadow-lg max-w-2xl mx-auto fade-in">
                        <h3 class="font-black text-rose-900 text-3xl mb-4">${remainingRemedial>0?'REMEDIAL':'TIDAK LULUS'}</h3>
                        <p class="text-rose-800 text-base mb-8 max-w-lg mx-auto leading-relaxed font-medium">
                            Nilai Anda belum mencapai batas kelulusan 72,5.
                            ${remainingRemedial>0?`Masih tersedia <strong>${remainingRemedial} kesempatan remedial</strong>.`:'<strong>Kesempatan remedial telah habis.</strong>'}
                        </p>
                        ${remainingRemedial>0?`<button onclick="startExam(true)" class="bg-rose-600 hover:bg-rose-700 text-white font-black py-4 px-12 rounded-2xl shadow-xl uppercase tracking-widest text-sm">Mulai Remedial</button>`:''}
                    </div>
                `;
            }

            return `
                <header class="bg-slate-900 text-white px-4 py-5 border-b border-slate-800">
                    <div class="max-w-[1200px] mx-auto flex justify-between items-center">
                        <span class="text-xs font-black uppercase tracking-widest opacity-60">Laporan Akhir</span>
                        <button onclick="appState.currentScreen='login'; render();" class="text-[10px] sm:text-xs font-bold uppercase tracking-widest bg-white/10 hover:bg-white/20 px-5 py-2.5 rounded-xl transition">Keluar Sistem</button>
                    </div>
                </header>

                <main class="flex-1 w-full max-w-[1200px] mx-auto px-4 py-12 sm:py-16 fade-in">
                    <div class="bg-white rounded-[3rem] p-10 sm:p-16 text-center border border-slate-200 shadow-2xl shadow-slate-200/50 max-w-4xl mx-auto relative overflow-hidden">
                        ${data.passed ? '<div class="absolute top-0 right-0 p-8 text-emerald-400 opacity-20"><svg class="w-48 h-48" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg></div>' : ''}
                        
                        <div class="mb-5 relative z-10">
                            <span class="inline-block bg-slate-100 text-slate-500 font-black text-[10px] px-4 py-1.5 rounded-md uppercase tracking-widest border border-slate-200">
                                Bukti Kelulusan PPPK
                            </span>
                        </div>
                        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mb-3 tracking-tight relative z-10">${appState.name}</h1>
                        <p class="font-mono text-slate-500 text-sm font-bold mb-10 bg-slate-50 inline-block px-4 py-1.5 border border-slate-100 rounded relative z-10">${appState.nip}</p>

                        <div class="relative inline-block mb-10 z-10">
                            <div class="text-[6rem] sm:text-[9rem] leading-none font-black ${data.passed ? 'text-emerald-500' : 'text-rose-500'} tracking-tighter drop-shadow-sm">
                                ${data.score}
                            </div>
                            <div class="text-slate-400 font-black text-xs sm:text-sm tracking-[0.4em] uppercase mt-6">Skor Evaluasi (0-100)</div>
                        </div>
                        
                        <div class="flex justify-center mb-12 relative z-10">
                            <div class="inline-block px-10 py-3 rounded-xl font-black text-sm uppercase tracking-[0.2em] border-2 shadow-sm ${data.passed ? 'bg-emerald-50 border-emerald-400 text-emerald-700' : 'bg-rose-50 border-rose-400 text-rose-700'}">
                                ${data.passed ? 'LULUS (MEMENUHI AMBANG BATAS)' : 'TIDAK LULUS (GAGAL)'}
                            </div>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-6 max-w-2xl mx-auto relative z-10">
                            <div class="bg-white border-2 border-slate-100 px-6 py-5 rounded-2xl shadow-sm">
                                <p class="text-slate-400 text-[10px] font-black mb-1 tracking-widest uppercase">Jawaban Benar</p>
                                <p class="text-3xl font-black text-emerald-500">${data.correct}</p>
                            </div>
                            <div class="bg-white border-2 border-slate-100 px-6 py-5 rounded-2xl shadow-sm">
                                <p class="text-slate-400 text-[10px] font-black mb-1 tracking-widest uppercase">Jawaban Salah</p>
                                <p class="text-3xl font-black text-rose-500">${data.wrong}</p>
                            </div>
                        </div>
                    </div>
                    
                    ${conditionalContent}
                </main>
            `;
        }

        window.onload = render;
    </script>
</body>
</html>
